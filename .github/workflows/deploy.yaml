name: Deploy legacy Nuxt portfolio to GitHub Pages

# Production still serves the archived Nuxt site from legacy-nuxt/.
# The Astro site is checked by ci.yaml and will replace this workflow at switch-over.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: legacy-nuxt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'pnpm'
          cache-dependency-path: legacy-nuxt/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --preset github_pages
        env:
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_GTAG_ID: ${{ secrets.NUXT_PUBLIC_GTAG_ID }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: legacy-nuxt/.output/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
