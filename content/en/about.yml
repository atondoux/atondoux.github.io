content: |
  ## :earth_africa: My journey

  I am a full-stack developer and tech lead with over 15 years of experience.<br>
  <br>
  Since the beginning of my career, I have always worked in the world of web applications, a field where I strive to make a difference by designing and developing solutions that are useful in everyday life and accessible to as many people as possible. This is truly what motivates me and makes my work so exciting!<br>
  <br>
  I have contributed to large-scale projects for major companies such as [Veolia Water](https://www.veoliawatertechnologies.com/en/), [Ministry of Health](https://sante.gouv.fr/), [SNCF Connect & Tech](https://www.sncf-connect.com/en-en/), [Natixis](https://www.groupebpce.com/en/our-firms/natixis-corporate-investment-banking/), [Societe Generale](https://wholesale.banking.societegenerale.com/en/), [Softway Medical](https://www.groupesoftwaymedical.com/en/), [Orange Business](https://www.orange-business.com/en/), [Namirial](https://www.namirial.com/en/), and [Malt](https://www.malt.com/).

  ## :wrench: My ecosystem

  The tools I work with on a daily basis. The list keeps growing.

  |                                             |                                                                                                       |
  |---------------------------------------------|-------------------------------------------------------------------------------------------------------|
  | 📋️ **Methods**                              | Software Craftsmanship, Clean Architecture, Clean Code, Test Driven Development, Domain Driven Design |
  | 💻 **Programming Languages**                | Java, Kotlin, TypeScript, SQL                                                                         |
  | 🛠 **Frameworks**                           | Spring Boot, Quarkus, JHipster, Vue.js, Nuxt                                                          |
  | ☁️ **Cloud & DevOps**                       | SaaS, Microservices, Docker, OpenShift                                                                |
  | 🏗 **Build**                                | Gitlab CI/CD, Jenkins, Maven, Gradle                                                                  |
  | 🧪 **Testing**                              | JUnit, AssertJ, Mockito, Kotest, Jest, Vitest, Playwright, Gatling                                    |
  | 🏫 **Learning & Training**                  | Agentic Coding, Hexagonal Architecture, Domain Driven Design                                          |
  | 🗣 **Languages**                            | French (native), English (fluent)                                                                     |

  ## :mag: The way I work

  I believe that building quality applications starts with a deep understanding of the business domain. That's why I always start by **learning your business, challenges, and goals** before crafting technical solutions. I make sure to grasp the **why** before using my technical skills to solve the **how**.<br>
  <br>
  I develop products with an emphasis on **quality, durability, and maintainability**. I promote best practices and industry standards such as **Clean Architecture** and **Test Driven Development**.<br>
  <br>
  This means that my work can be taken over by any experienced developer. **Every piece of software I deliver is fully tested and documented**. This mindset enables me to deliver **applications that are tailored, flexible, and built to last**.

  ## :seedling: My continuous learning

  In the world of software development, things evolve quickly, very quickly. New technologies emerge while others become obsolete almost overnight.<br>
  <br>
  Staying up to date through continuous learning is essential in this field.<br>
  <br>
  This is why **I invest at least 10% of my annual revenue in training every year**: learning new languages and frameworks, discovering new methodologies, exploring AI-based solutions...

  ## :robot: My use of AI

  Over the past few years, Generative AI has profoundly transformed the software development industry.<br>
  <br>
  **I use AI and agentic development on a daily basis**, and I have built a working environment composed of agents and skills that reflects my approach to software design: a thorough understanding of requirements, code covered by automated tests, and a commitment to quality at every step.<br>
  <br>
  I remain fully accountable for the code that is delivered: nothing ships without my review and approval.

  ## :handshake: Interested? Let's talk!

  If you have a project or an idea and would like to move it forward, feel free to contact me via <a href="https://www.linkedin.com/in/atondoux/" target="_blank">LinkedIn</a> or schedule a meeting through <a href="https://calendly.com/atondoux/30min" target="_blank">Calendly</a>.
