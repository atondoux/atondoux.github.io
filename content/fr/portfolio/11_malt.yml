content: |
  ## :man_technologist: Mon rôle

  Développeur Full Stack

  ## :dart: Mes actions

  - Améliorer le module de financement pour permettre aux freelances d'être payés dans les meilleurs délais et optimiser les flux financiers de la plateforme
  - Automatiser un maximum de procédures afin d'améliorer l'efficacité opérationnelle de l'équipe FinOps
  - Étendre les capacités du module à intégrer différents partenaires de financement
  - Rendre plus intelligent le moteur de décision servant à sélectionner le meilleur partenaire de financement

  ## :globe_with_meridians: Liens

  En savoir plus sur <a href="https://www.malt.fr/" target="_blank">Malt</a>
